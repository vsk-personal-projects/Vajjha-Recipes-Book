server:
  port: ${PORT:8080}
spring:
  application:
    name: recipes-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/recipes}
    username: ${DB_USER:recipes_owner}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  access-key: ${APP_ACCESS_KEY:}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
