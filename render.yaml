services:
  - type: web
    name: vajjha-recipes-api
    runtime: docker
    region: singapore
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ACCESS_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
